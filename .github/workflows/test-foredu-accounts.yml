name: Test Foredu account containers
on:
  push:
    branches: [codex/foredu-accounts]
    paths:
      - deploy/accounts/**
      - scripts/qa-foredu-docker.mjs
      - .github/workflows/test-foredu-accounts.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check migrations and non-root gateway using disposable containers
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,CI "$(command -v node)" scripts/qa-foredu-docker.mjs
