services:
  careerfolio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: careerfolio
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
      NEXT_PUBLIC_SUPABASE_URL: "${NEXT_PUBLIC_SUPABASE_URL:-}"
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}"
      ACCOUNT_SERVICE_URL: "${ACCOUNT_SERVICE_URL:-https://literature.lhsstart.synology.me}"
      TEACHER_EMAILS: "${TEACHER_EMAILS:-lhsstart@gmail.com,admin@admin.com}"
      STUDENT_EMAILS: "${STUDENT_EMAILS:-stu01@st.com}"
    ports:
      - "${CA_PORT:-7310}:3000"
    volumes:
      - careerfolio-data:/data

volumes:
  careerfolio-data:
