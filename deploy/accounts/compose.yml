name: foredu-accounts
services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: foredu_auth
      POSTGRES_DB: accounts
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run the setup first}
      PGDATA: /data/postgres
    entrypoint: ["sh", "-c", "test \"$$(cat /data/.foredu-storage)\" = accounts-v1 || exit 1; chown postgres:postgres /data; exec docker-entrypoint.sh postgres"]
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/10-auth-schema.sql:ro
      - type: bind
        source: /volume2/webapps/accounts/data
        target: /data
        bind:
          create_host_path: false
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foredu_auth -d accounts"]
      interval: 5s
      timeout: 5s
      retries: 20
  auth:
    image: supabase/gotrue:v2.197.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: https://auth.foredu.synology.me
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://foredu_auth:${POSTGRES_PASSWORD}@db:5432/accounts
      GOTRUE_DB_NAMESPACE: auth
      GOTRUE_SITE_URL: https://ca.foredu.synology.me
      GOTRUE_URI_ALLOW_LIST: https://ca.foredu.synology.me,https://grammar.foredu.synology.me,https://literature.foredu.synology.me
      GOTRUE_JWT_SECRET: ${JWT_SECRET:?Run the setup first}
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_EXP: 3600
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_PASSWORD_MIN_LENGTH: 8
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: "true"
      GOTRUE_SECURITY_REFRESH_TOKEN_REUSE_INTERVAL: 10
      GOTRUE_MAILER_OTP_EXP: 900
      GOTRUE_MAILER_OTP_LENGTH: 6
      GOTRUE_SMTP_HOST: smtp.gmail.com
      GOTRUE_SMTP_PORT: 587
      GOTRUE_SMTP_USER: ${SMTP_USER:?Gmail address required}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:?Gmail app password required}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_USER}
      GOTRUE_SMTP_SENDER_NAME: Foredu 공통계정
      GOTRUE_SMTP_MAX_FREQUENCY: 60s
      GOTRUE_RATE_LIMIT_EMAIL_SENT: 30
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: http://accounts:3000/mail/confirmation
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
    networks: [private]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 20
  accounts:
    build: .
    restart: unless-stopped
    environment:
      PUBLIC_AUTH_URL: https://auth.foredu.synology.me
      AUTH_INTERNAL_URL: http://auth:9999
      ALLOWED_ORIGINS: https://ca.foredu.synology.me,https://grammar.foredu.synology.me,https://literature.foredu.synology.me,https://auth.foredu.synology.me
      TEACHER_EMAILS: ${TEACHER_EMAILS:?Teacher email required}
    ports: ["127.0.0.1:7320:3000"]
    networks:
      private:
      shared:
        aliases: [foredu-accounts]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 20s
      retries: 10
networks:
  private:
  shared:
    external: true
    name: foredu-shared
